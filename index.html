*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--ink);color:var(--text);font-family:'Figtree',system-ui,sans-serif;min-height:100vh;
  background-image:
    radial-gradient(520px 360px at 92% -40px,rgba(255,204,102,.15),transparent 70%),

}

h1,h2,h3,.disp{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;margin:0}
h2{font-size:22px} h3{font-size:17px}
p{line-height:1.55;margin:8px 0}
.mono{font-family:'JetBrains Mono',monospace}
.mute{color:var(--mute)}
.center{text-align:center;justify-content:center}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.card{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lav)}
.big{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:30px;line-height:1.15;margin:10px 0}
.qlabel{font-size:14px;color:var(--mute);margin-bottom:4px}
.qprompt{margin-bottom:10px}

.btn{background:var(--lamp);color:#241a00;border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:15px;cursor:pointer;width:100%;transition:transform .1s}

.btn.small{width:auto;padding:9px 14px;font-size:13px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.row .btn.small{flex:0 0 auto}

.inp{width:100%;background:var(--ink);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:14px;font-size:17px;font-family:inherit;margin-top:10px}

textarea.inp{font-family:'JetBrains Mono',monospace;font-size:12px;min-height:120px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{background:var(--ink2);border:1px solid var(--line);color:var(--mute);width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;flex:0 0 auto}
.steps{display:flex;gap:6px;flex:1;justify-content:center}

.st.on{opacity:1;border-color:var(--lamp);box-shadow:0 0 0 3px rgba(255,204,102,.18)}
.st.done{background:var(--lampd);color:var(--lamp);opacity:1;font-size:14px;font-weight:800;border-color:var(--lampd)}
.clock{font-size:13px;color:var(--mute);min-width:46px;text-align:right}
.clock.goal{color:var(--lamp)}
.blockname{display:flex;flex-direction:column;margin:2px 2px 12px}
.blockname b{font-family:'Bricolage Grotesque',sans-serif;font-size:20px}

.bar{height:8px;background:var(--ink3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lav),var(--lamp));transition:width .3s}
.qhead{margin-bottom:10px;display:flex;flex-direction:column;gap:6px}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.opt{text-align:left;background:var(--ink3);border:1.5px solid var(--line);color:var(--text);padding:13px 14px;border-radius:13px;font-size:15px;cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--lamp)}
.opt.ok{background:rgba(121,224,181,.14);border-color:var(--mint);color:var(--mint);font-weight:700}
.opt.bad{background:rgba(255,123,138,.12);border-color:var(--coral);color:var(--coral)}
.fb{margin-top:12px;padding:12px 14px;border-radius:13px;background:var(--ink3);font-size:14px;line-height:1.5}
.fb.ok{border-left:4px solid var(--mint)}
.fb.bad{border-left:4px solid var(--coral)}
.fb + .btn{margin-top:10px}

.wave{display:flex;gap:4px;align-items:center;justify-content:center;height:50px;margin:8px 0}
.wave i{width:5px;height:10px;background:var(--lav);border-radius:3px;opacity:.45}
.speaking .wave i{animation:eq .9s ease-in-out infinite;opacity:1;background:var(--lamp)}
@keyframes eq{0%,100%{height:8px}50%{height:42px}}

.reveal{margin-top:14px}
.reveal .lbl{font-size:12px;color:var(--mute);margin:10px 0 4px}
.line{font-size:18px;line-height:1.9}
.w{display:inline-block;padding:1px 7px;margin:2px 2px;border-radius:7px;background:var(--ink3)}
.w.ok{background:rgba(121,224,181,.16);color:var(--mint)}
.w.miss{background:rgba(255,123,138,.15);color:var(--coral)}
.full .w{animation:drop .4s both;background:rgba(255,204,102,.13);color:var(--lamp)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.tip{background:var(--ink3);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;line-height:1.5}

.build{min-height:58px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
.tok{background:var(--ink3);border:1.5px solid var(--line);color:var(--text);border-radius:11px;padding:9px 12px;font-size:16px;cursor:pointer}
.ph{color:var(--mute);font-size:14px;padding:6px}

.ring{position:relative;width:84px;height:84px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;text-align:center;line-height:1}

.stat{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:24px;color:var(--lamp)}
.stat span{font-size:11px;color:var(--mute)}
.week{display:flex;justify-content:space-between;margin:2px 0 14px}
.day{width:38px;text-align:center;font-size:11px;color:var(--mute)}
.day i{display:block;width:26px;height:26px;margin:4px auto 0;border-radius:50%;background:var(--ink2);border:1px solid var(--line)}
.day.on i{background:var(--lamp);border-color:var(--lamp)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mode{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--text);cursor:pointer}
.mode:hover{border-color:var(--lamp)}
.mode b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;margin:4px 0 2px}
.mode span{font-size:12px;color:var(--mute)}

.badge{display:inline-block;font-size:12px;padding:5px 10px;border-radius:20px;margin:3px 3px 0 0;background:var(--ink3);color:var(--mute);opacity:.6}
.badge.on{background:var(--lampd);color:var(--lamp);opacity:1}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head svg{flex:0 0 auto}
.head h1{font-size:28px;line-height:1}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;font-size:14px}
.li .t b{font-size:15px}
.dots{letter-spacing:2px;color:var(--lamp);font-size:11px}
.hearts{font-size:20px;letter-spacing:3px}
.small{font-size:13px}
.mt{margin-top:12px}

.modal{position:fixed;inset:0;background:rgba(10,9,24,.74);display:grid;place-items:center;z-index:50;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:360px;width:100%}
.day-l{width:46px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mute);flex:0 0 auto}
.num{width:42px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.li.th{padding:0 0 6px;font-size:11px;color:var(--mute)}
.li.th .num,.li.th .day-l{font-size:11px;font-family:'Figtree',system-ui,sans-serif}

.catface .cat-mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.25)}
.speaking .catface .cat-mouth{animation:talk .26s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.15)}}
.msgs{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.bub{max-width:90%;padding:11px 14px;border-radius:16px;font-size:15.5px;line-height:1.45;overflow-wrap:anywhere}
.bub.cat{align-self:flex-start;background:var(--ink3);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--lampd);border-bottom-right-radius:5px}
.bub .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bub .hid{color:var(--mute);font-style:italic}
.chatbar{display:flex;gap:8px;margin-top:8px}
.chatbar .inp{margin-top:0;flex:1;min-width:0}
.chatbar .btn{width:auto;flex:0 0 auto}
.w{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 6px 8px 0;line-height:1.25}
.w .g{font-size:11.5px;color:var(--lamp);font-weight:600;min-height:14px}
.w .e{font-size:15.5px}
.trf{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--mute)}
.corr{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.corr:last-child{border-bottom:0}
.corr .bad{color:var(--coral);text-decoration:line-through}
.corr .good{color:var(--mint);font-weight:700}

let mem=null;
function load(){
  const d=defaults();
  try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);Object.keys(d).forEach(k=>{if(p[k]!==undefined)d[k]=(typeof d[k]==="object"&&!Array.isArray(d[k]))?Object.assign(d[k],p[k]):p[k];});}}
  catch(e){if(mem)return mem;}
  return d;
}
let db=load();
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){mem=db;}}
function save(){db.t=Date.now();persistLocal();schedulePush();}

/* ---- sincronização com a conta (db + user): progresso privado por pessoa ---- */
let cloudDoc=null,cloudOn=false,pushTimer=null,pushing=false,pendingPush=false;
function schedulePush(){if(!cloudDoc)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushCloud,1500);}
async function pushCloud(){
  if(!cloudDoc)return;
  if(pushing){pendingPush=true;return;}
  pushing=true;
  const body=()=>({s:JSON.stringify(db),t:db.t});
  try{await cloudDoc.set(body());}
  catch(e){
    if(e&&e.code==="unavailable"){
      await new Promise(r=>setTimeout(r,800+Math.random()*800));
      try{await cloudDoc.set(body());}catch(_){}
    }
  }
  pushing=false;
  if(pendingPush){pendingPush=false;schedulePush();}
}
function adopt(raw){
  try{
    const p=JSON.parse(raw),d=defaults();
    Object.keys(d).forEach(k=>{if(p[k]!==undefined)d[k]=(typeof d[k]==="object"&&!Array.isArray(d[k]))?Object.assign(d[k],p[k]):p[k];});
    db=d;persistLocal();return true;
  }catch(e){return false;}
}
function refreshHome(){if($(".hero")&&!S)home();}
async function initCloud(){
  try{
    const parts=await Promise.all([claude.use("db"),claude.use("user")]);
    const cd=parts[0],um=parts[1];
    if(!cd||!um)return;
    const id=await um.id();
    if(!id)return;
    cloudDoc=cd.collection("data/users/"+id).doc("progress");
    let first=true;
    cloudDoc.onSnapshot(snap=>{
      const wasOff=!cloudOn;cloudOn=true;
      const d=snap.exists?snap.data():null;
      let changed=false;
      if(d&&typeof d.t==="number"&&d.t>db.t&&!S){changed=adopt(d.s);}
      else if(first&&db.t>0&&(!d||d.t<db.t)){schedulePush();}
      first=false;
      if(changed||wasOff)refreshHome();
    },()=>{});
  }catch(e){}
}

/* ---------- comparação de frases ---------- */
const normW=w=>w.toLowerCase().replace(/[’‘]/g,"'").replace(/'/g,"").replace(/[^a-z0-9]/g,"");
const wordsOf=s=>String(s).split(/\s+/).map(raw=>({raw,n:normW(raw)})).filter(x=>x.n);
function align(user,target){
  const m=user.length,n=target.length;
  if(!n)return{flags:[],score:0};
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=user[i-1]===target[j-1].n?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const flags=new Array(n).fill(false);let i=m,j=n;
  while(i>0&&j>0){
    if(user[i-1]===target[j-1].n){flags[j-1]=true;i--;j--;}
    else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;
  }
  return{flags,score:dp[m][n]/n};
}

const TTS="speechSynthesis" in window;
let VOICES=[],tok=0,seq=0;
function loadVoices(){if(TTS)VOICES=speechSynthesis.getVoices();}
if(TTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
const vq=v=>(/natural|neural|enhanced|premium/i.test(v.name)?3:0)+(/google/i.test(v.name)?2:0)+(v.localService?0:1);
function voiceFor(acc,i){
  const lang=LANG[acc]||"en-US";
  let l=VOICES.filter(v=>v.lang.replace("_","-")===lang);
  if(!l.length)l=VOICES.filter(v=>/^en/i.test(v.lang));
  l.sort((a,b)=>vq(b)-vq(a));
  return l.length?l[i%l.length]:null;
}
function say(text,o={}){
  return new Promise(res=>{
    if(!TTS){res();return;}
    const my=++tok;speechSynthesis.cancel();
    const acc=o.accent||db.settings.accent,rate=o.rate||1;
    const u=new SpeechSynthesisUtterance(text);
    u.lang=LANG[acc];const v=voiceFor(acc,o.voice||0);if(v)u.voice=v;
    u.rate=rate;u.pitch=o.pitch||1;
    let finished=false;
    const fin=()=>{if(finished)return;finished=true;if(my===tok)document.body.classList.remove("speaking");res();};
    u.onend=fin;u.onerror=fin;
    setTimeout(()=>{
      if(my!==tok){fin();return;}
      document.body.classList.add("speaking");
      speechSynthesis.speak(u);
    },40);
    setTimeout(fin,Math.max(2500,text.length*130/rate+2000));
  });
}
async function playLines(lines,accent,rate){
  const my=++seq;
  for(const l of lines){
    if(my!==seq)return;
    await say(l.text,{accent,rate,voice:l.who==="B"?1:0,pitch:l.who==="B"?0.85:1});
    await sleep(250);
  }
}
function stopAll(){tok++;seq++;if(TTS)speechSynthesis.cancel();document.body.classList.remove("speaking");}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=false;
const micOK=()=>!!SR&&!micBlocked;
function listen(){
  return new Promise((res,rej)=>{
    if(!SR){rej("nosr");return;}
    const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;
    let got=null;
    r.onresult=e=>{got=e.results[0][0].transcript;};
    r.onerror=e=>rej(e.error||"erro");
    r.onend=()=>res(got);
    try{r.start();}catch(e){rej("erro");}
    setTimeout(()=>{try{r.stop();}catch(e){}},9000);
  });
}

function waveHTML(){return`<div class="wave">${Array.from({length:17},(_,i)=>`<i style="animation-delay:${(i%6)*0.12}s"></i>`).join("")}</div>`;}
function quiz(qs,o){
  let i=0,correct=0;const by={},wrong=[];
  const play=(q,r)=>{
    if(!q.audio)return;
    if(q.audio.lines)playLines(q.audio.lines,q.audio.accent,r);
    else say(q.audio.text,{accent:q.audio.accent,rate:r});
  };
  function show(){
    const q=qs[i];
    if(!q){o.onDone({correct,total:qs.length,by,wrong});return;}
    o.mount(`<div class="qhead"><span class="tag">${esc(o.title||"")} · ${i+1}/${qs.length}</span><div class="bar"><i style="width:${i/qs.length*100}%"></i></div></div>
      <div class="card"><div class="qprompt">${q.prompt}</div>
      ${q.audio?`${waveHTML()}<div class="row center"><button class="btn small ghost" data-act="cur" data-fn="play" data-r="0.75">🐢 Devagar</button><button class="btn small" data-act="cur" data-fn="play" data-r="1">▶ Ouvir</button></div>`:""}
      <div class="opts">${q.opts.map((t,k)=>`<button class="opt" data-act="cur" data-fn="ans" data-k="${k}">${esc(t)}</button>`).join("")}</div>
      <div id="qfb"></div></div>`);
    cur={
      play(el){play(q,+el.dataset.r||1);},
      ans(el){
        if(q._done)return;q._done=true;
        const k=+el.dataset.k,ok=k===q.a;
        if(ok)correct++;else wrong.push(q);
        by[q.kind]=by[q.kind]||{c:0,t:0};by[q.kind].t++;if(ok)by[q.kind].c++;
        document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("ok");else if(j===k)b.classList.add("bad");});
        $("#qfb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"✓ Certo!":"✕ Quase."}</b>${q.expl?`<div class="mt">${q.expl}</div>`:""}</div>
          <button class="btn" data-act="cur" data-fn="cont">${i+1<qs.length?"Continuar →":"Concluir"}</button>`;
        if(o.onAnswer)o.onAnswer(ok,q);
      },
      cont(){i++;show();}
    };
    if(q.audio&&q.audio.auto)play(q,1);
  }
  show();
}
function buildQs(n,chunkPool,decPool){
  const c=content();const cp=chunkPool.length?chunkPool:c.chunks,dp=decPool.length?decPool:c.dec;
  const cs=shuffle(cp),ds=shuffle(dp);let ci=0,di=0;const kinds=["hear-sent","chunk-pt","hear-ex","pt-chunk"];const qs=[];
  for(let k=0;k<n;k++){
    const kind=kinds[k%4];
    if(kind==="hear-sent"){
      const it=ds[di++%ds.length];
      const opts=shuffle([it.full,...pick(c.dec.filter(x=>x.full!==it.full),3).map(x=>x.full)]);
      qs.push({kind:"ouvido",prompt:`<div class="qlabel">Ouça (fala rápida). O que a pessoa disse?</div>`,audio:{text:it.said,auto:true},opts,a:opts.indexOf(it.full),
        expl:`<span class="mono">${esc(it.said)}</span> → <b>${esc(it.full)}</b><br>${esc(it.pt)}<br><span class="mute">💡 ${esc(it.tip||"")}</span>`});
    }else{
      const it=cs[ci++%cs.length];
      const others=c.chunks.filter(x=>x.en!==it.en);
      if(kind==="chunk-pt"){
        const opts=shuffle([it.pt,...pick(others,3).map(x=>x.pt)]);
        qs.push({kind:"vocab",prompt:`<div class="qlabel">O que significa?</div><div class="big">${esc(it.en)}</div>`,audio:{text:it.en},opts,a:opts.indexOf(it.pt),
          expl:`<b>${esc(it.en)}</b> = ${esc(it.pt)}<br><i>${esc(it.ex)}</i>`});
      }else if(kind==="hear-ex"){
        const opts=shuffle([it.exPt,...pick(others,3).map(x=>x.exPt)]);
        qs.push({kind:"ouvido",prompt:`<div class="qlabel">Ouça a frase e escolha a tradução.</div>`,audio:{text:it.ex,auto:true},opts,a:opts.indexOf(it.exPt),
          expl:`<i>${esc(it.ex)}</i><br>${esc(it.exPt)}`});
      }else{
        const opts=shuffle([it.en,...pick(others,3).map(x=>x.en)]);
        qs.push({kind:"vocab",prompt:`<div class="qlabel">Qual expressão em inglês quer dizer:</div><div class="big">${esc(it.pt)}</div>`,opts,a:opts.indexOf(it.en),
          expl:`<b>${esc(it.en)}</b><br><i>${esc(it.ex)}</i>`});
      }
    }
  }
  return qs;
}

/* ============================================================

const stage=h=>{$("#stage").innerHTML=h;window.scrollTo(0,0);};
function startSession(){
  clearTimers();stopAll();
  S={i:0,secs:0,xp:0,done:[],seen:[],missed:[],dseen:[],decOk:0,decTot:0,committedSecs:0};
  tickInt=setInterval(()=>{
    if(document.hidden||!S)return;
    S.secs++;const el=$("#clock");
    if(el){el.textContent=fmtClock(S.secs);el.classList.toggle("goal",S.secs>=1800);}
  },1000);
  runBlock();
}
function runBlock(){
  stopAll();const b=BLOCKS[S.i];
  app.innerHTML=`<div class="top"><button class="x" data-act="exitSession" aria-label="Sair">✕</button>
    <div class="steps">${BLOCKS.map((x,k)=>`<span class="st ${k<S.i?"done":k===S.i?"on":""}" title="${x.name}">${k<S.i?"✓":x.ico}</span>`).join("")}</div>
    <div class="clock mono" id="clock">${fmtClock(S.secs)}</div></div>
    <div class="blockname"><b>${b.name}</b><span>${b.desc} · ~${b.min} min</span></div><div id="stage"></div>`;
  ({srs:aSRS,dec:aDEC,lis:aLIS,sha:aSHA,bld:aBLD,end:aEND})[b.id]();
}
function finishBlock(){S.done.push(BLOCKS[S.i].id);S.i++;runBlock();}
function commit(markDay){
  if(!S)return;const t=today();
  db.secs[t]=(db.secs[t]||0)+(S.secs-S.committedSecs);S.committedSecs=S.secs;
  if(markDay||S.done.length>=3)db.days[t]=true;
  save();
}
let askCb=null;
function ask(msg,yes){
  askCb=yes;
  const m=document.createElement("div");m.className="modal";m.id="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p style="margin-top:0">${esc(msg)}</p><div class="row"><button class="btn ghost" data-act="askNo">Cancelar</button><button class="btn" data-act="askYes">Confirmar</button></div></div>`;
  document.body.appendChild(m);
}
function exitSession(){
  const go=()=>{commit(false);home();};
  if(S&&S.i<BLOCKS.length-1)ask("Sair da sessão? O que você já fez fica salvo.",go);else go();
}

/* ---------- 1. Revisão (repetição espaçada) ---------- */
function aSRS(){
  const c=content(),t=today();
  const weakS=(rec)=>((rec.lapses||0)*2)+Math.random()*1.5-(rec.box||0)*0.3;
  const due=c.chunks.filter(x=>db.cards[x.en]&&db.cards[x.en].due<=t).sort((a,b)=>weakS(db.cards[b.en])-weakS(db.cards[a.en])).slice(0,10);
  const nNew=db.lastAgain>0.4?3:5;
  const fresh=c.chunks.filter(x=>!db.cards[x.en]).slice(0,nNew);
  const queue=[...due,...fresh];const total=queue.length;let idx=0;
  if(!total){stage(`<div class="card center"><h2>Nada para revisar hoje 🎉</h2><p class="mute">Todas as cartas estão em dia. Importe um pacote novo na Biblioteca quando quiser mais.</p><button class="btn" data-act="next">Continuar</button></div>`);return;}
  function show(){
    const it=queue[idx];
    if(!it){if(S.srsTot){db.lastAgain=S.srsAgain/S.srsTot;save();}finishBlock();return;}
    const isNew=!db.cards[it.en];
    stage(`<div class="qhead"><span class="tag">${isNew?"Nova":"Revisão"} · ${Math.min(idx+1,total)}/${total}</span><div class="bar"><i style="width:${idx/total*100}%"></i></div></div>
      <div class="card center"><div class="tag">${esc(it.cat)}</div><div class="big">${esc(it.en)}</div>
      <button class="btn small ghost" data-act="say" data-t="${esc(it.en)}">🔊 Ouvir</button>
      <p class="mute">O que significa? Tente lembrar antes de virar.</p>
      <button class="btn" data-act="cur" data-fn="flip">Mostrar significado</button></div>`);
    say(it.en);
    cur={
      flip(){
        stage(`<div class="qhead"><span class="tag">${Math.min(idx+1,total)}/${total}</span><div class="bar"><i style="width:${idx/total*100}%"></i></div></div>
          <div class="card"><div class="tag">${esc(it.cat)}</div><div class="big">${esc(it.en)}</div>
          <div style="font-size:20px;color:var(--lamp);font-weight:700">${esc(it.pt)}</div>
          <div class="tip"><i>${esc(it.ex)}</i><br><span class="mute">${esc(it.exPt)}</span></div>
          <div class="row"><button class="btn small ghost" data-act="say" data-t="${esc(it.ex)}">🔊 Frase</button><button class="btn small ghost" data-act="say" data-t="${esc(it.ex)}" data-r="0.7">🐢 Devagar</button></div>
          <p class="mute small mt">Como foi lembrar?</p>
          <div class="row"><button class="btn ghost" data-act="cur" data-fn="rate" data-v="again">Errei</button><button class="btn ghost" data-act="cur" data-fn="rate" data-v="hard">Difícil</button><button class="btn" data-act="cur" data-fn="rate" data-v="good">Fácil</button></div></div>`);
        say(it.ex);
      },
      rate(el){
        const v=el.dataset.v;
        const cd=db.cards[it.en]||{box:0,due:t,seen:0,lapses:0};
        cd.seen++;
        if(v==="again"){cd.box=0;cd.due=t;cd.lapses++;if(!it._req){it._req=true;queue.push(it);}if(!S.missed.includes(it))S.missed.push(it);addXP(1);}
        else if(v==="hard"){cd.box=Math.max(1,cd.box);cd.due=addDays(t,INT[cd.box]);addXP(3);}
        else{cd.box=Math.min(6,cd.box+1);cd.due=addDays(t,INT[cd.box]);addXP(5);}
        db.cards[it.en]=cd;S.srsTot=(S.srsTot||0)+1;if(v==="again")S.srsAgain=(S.srsAgain||0)+1;bump("srs",v!=="again");save();
        if(!S.seen.includes(it))S.seen.push(it);
        idx++;show();
      }
    };
  }
  show();
}

/* ---------- 2. Decodificador de fala rápida ---------- */
function decRec(it){
  if(!db.dec[it.said])db.dec[it.said]={ok:0,seen:0,box:0,due:"",lapses:0};
  return db.dec[it.said];
}
function bump(kind,ok){
  const d=today();
  const s=db.stats[d]||(db.stats[d]={dec:[0,0],srs:[0,0]});
  s[kind][1]++;if(ok)s[kind][0]++;
}
function aDEC(){
  const c=content(),t=today();
  const seenRec=x=>db.dec[x.said]&&db.dec[x.said].seen>0;
  const due=c.dec.filter(x=>seenRec(x)&&(db.dec[x.said].due||"")<=t).sort((a,b)=>(((db.dec[b.said].lapses||0)*2+Math.random())-((db.dec[a.said].lapses||0)*2+Math.random())));
  const fresh=c.dec.filter(x=>!seenRec(x));
  const nDue=Math.min(due.length,5),nNew=Math.min(fresh.length,6-nDue);
  let queue=[...due.slice(0,nDue),...fresh.slice(0,nNew)];
  if(queue.length<6){
    const rest=c.dec.filter(x=>!queue.includes(x)).sort((a,b)=>(((db.dec[a.said]||{}).box||0)-((db.dec[b.said]||{}).box||0))+(Math.random()-.5)*2);
    queue=queue.concat(rest.slice(0,6-queue.length));
  }
  queue=shuffle(queue);
  const accs=shuffle(["US","UK","AU"]);
  const retried=new Set();
  let idx=0;
  function show(){
    const it=queue[idx];
    if(!it){finishBlock();return;}
    const acc=accs[idx%3],sp=db.speed||0.9;
    stage(`<div class="qhead"><span class="tag">Decodificador · ${idx+1}/${queue.length} · ${ACC_LABEL[acc]}</span><div class="bar"><i style="width:${idx/queue.length*100}%"></i></div></div>
      <div class="card"><p class="mute small" style="margin-top:0">Passo 1: ouça sem ler e escreva o que entendeu, mesmo que só uma parte. Velocidade: <b>${sp.toFixed(2)}×</b> (ela se ajusta aos seus acertos).</p>
      ${waveHTML()}
      <div class="row center"><button class="btn small ghost" data-act="say" data-t="${esc(it.said)}" data-a="${acc}" data-r="0.7">🐢 Devagar</button><button class="btn small" data-act="say" data-t="${esc(it.said)}" data-a="${acc}" data-r="${sp}">▶ Ouvir</button><button class="btn small ghost" data-act="say" data-t="${esc(it.said)}" data-a="${acc}" data-r="1.25">🐇 Rápido</button></div>
      <input id="ans" class="inp" placeholder="Escreva o que você ouviu…" autocomplete="off" autocapitalize="none" spellcheck="false">
      <div class="row"><button class="btn" data-act="cur" data-fn="check">Verificar</button><button class="btn ghost small" data-act="cur" data-fn="hint">Dica</button><button class="btn ghost small" data-act="cur" data-fn="giveup">Não entendi</button></div>
      <div id="fb"></div></div>`);
    setTimeout(()=>{const inp=$("#ans");if(inp)inp.focus({preventScroll:true});},50);
    say(it.said,{accent:acc,rate:sp});
    cur={
      hint(){const w=wordsOf(it.full);$("#fb").innerHTML=`<div class="fb">Dica: ${w.length} palavras · começa com “${esc(w[0].raw)}”</div>`;},
      check(){
        const v=$("#ans").value.trim();if(!v)return;
        const u=v.split(/\s+/).map(normW).filter(Boolean);
        const sw=wordsOf(it.said),fw=wordsOf(it.full);
        const a1=align(u,sw),a2=align(u,fw);
        reveal(Math.max(a1.score,a2.score),a1.flags,a2.flags);
      },
      giveup(){reveal(0,null,null);},
      next(){idx++;show();}
    };
    function reveal(score,fs,ff){
      const ok=score>=0.8;
      const sw=wordsOf(it.said),fw=wordsOf(it.full);
      const rec=decRec(it);rec.seen++;
      if(ok){rec.ok++;rec.box=Math.min(6,(rec.box||0)+1);rec.due=addDays(t,INT[rec.box]);}
      else{rec.box=0;rec.lapses=(rec.lapses||0)+1;rec.due=t;if(!retried.has(it.said)){retried.add(it.said);queue.push(it);}}
      const cs=db.speed||0.9;
      db.speed=ok?Math.min(1.25,+(cs+0.05).toFixed(2)):Math.max(0.7,+(cs-0.1).toFixed(2));
      bump("dec",ok);
      db.decStats.total++;if(ok)db.decStats.ok++;
      S.decTot++;if(ok)S.decOk++;
      if(!S.dseen.includes(it))S.dseen.push(it);
      addXP(ok?10:3);
      const inp=$("#ans");if(inp)inp.disabled=true;
      const sayHTML=sw.map((w,k)=>`<span class="w ${fs?(fs[k]?"ok":"miss"):""}">${esc(w.raw)}</span>`).join("");
      const fullHTML=fw.map((w,k)=>`<span class="w" style="animation-delay:${k*0.12}s">${esc(w.raw)}</span>`).join("");
      $("#fb").innerHTML=`<div class="reveal">
        <div class="fb ${ok?"ok":"bad"}"><b>${ok?"✓ Você decodificou!":"Sem problema, esse é o treino."}</b>${fs?` Acerto: ${Math.round(score*100)}%`:""}${ok?"":" Essa fala volta no fim do bloco e nos próximos dias."}</div>
        <div class="lbl">PASSO 2 · COMO SOA (fala rápida)</div><div class="line mono">${sayHTML}</div>
        <div class="lbl">NA VERDADE É</div><div class="line full">${fullHTML}</div>
        <div class="mute">${esc(it.pt)}</div>
        <div class="tip">💡 ${esc(it.tip||"")}</div>
        <div class="lbl">PASSO 3 · ouça de novo, agora reconhecendo cada palavra</div>
        <div class="row"><button class="btn small ghost" data-act="say" data-t="${esc(it.said)}" data-a="${acc}" data-r="${db.speed}">👂 Ouvir de novo</button><button class="btn small ghost" data-act="say" data-t="${esc(it.full)}" data-a="${acc}" data-r="0.8">📖 Forma completa</button></div>
        <button class="btn mt" data-act="cur" data-fn="next">${idx+1<queue.length?"Próxima →":"Concluir bloco"}</button></div>`;
    }
  }
  show();
}

          <button class="btn mt" data-act="next">Continuar</button></div>`);
      }});
    }
  };
}

/* ---------- 4. Sombra (shadowing) ---------- */
function aSHA(){
  const c=content();
  const pool=c.chunks.filter(x=>{const n=x.ex.split(" ").length;return n>=4&&n<=9;});
  const seen=pool.filter(x=>db.cards[x.en]);
  const items=pick(seen.length>=4?seen:pool,4);let i=0;
  function show(){
    const it=items[i];
    if(!it){finishBlock();return;}
    stage(`<div class="qhead"><span class="tag">Sombra · ${i+1}/${items.length}</span><div class="bar"><i style="width:${i/items.length*100}%"></i></div></div>
      <div class="card center"><p class="mute small" style="margin-top:0">1) Ouça. 2) Repita em voz alta imitando o ritmo e a melodia, não só as palavras.</p>
      <div class="big" style="font-size:24px">${esc(it.ex)}</div><div class="mute">${esc(it.exPt)}</div>
      ${waveHTML()}
      <div class="row center"><button class="btn small ghost" data-act="say" data-t="${esc(it.ex)}" data-r="0.7">🐢 Devagar</button><button class="btn small" data-act="say" data-t="${esc(it.ex)}" data-r="1">▶ Normal</button></div>
      <div class="row">${micOK()?`<button class="btn" data-act="cur" data-fn="mic" id="micbtn">🎤 Falar agora</button>`:""}<button class="btn ghost" data-act="cur" data-fn="self">${micOK()?"Pular microfone":"Falei em voz alta ✓"}</button></div>
      <div id="fb"></div></div>`);
    say(it.ex);
    cur={
      async mic(){
        const b=$("#micbtn");b.disabled=true;b.textContent="🎤 Ouvindo… fale agora";
        try{
          const heard=await listen();
          if(!heard){$("#fb").innerHTML=`<div class="fb">Não captei nada. Tente de novo, perto do microfone.</div>`;b.disabled=false;b.textContent="🎤 Tentar de novo";return;}
          const r=align(heard.split(/\s+/).map(normW).filter(Boolean),wordsOf(it.ex));
          const pc=Math.round(r.score*100);
          addXP(pc>=75?8:4);
          $("#fb").innerHTML=`<div class="fb ${pc>=75?"ok":"bad"}"><b>${pc>=75?"✓ Boa!":"Dá pra melhorar."} ${pc}%</b><div class="mt">O app entendeu: <i>${esc(heard)}</i></div></div>
            <div class="row"><button class="btn ghost" data-act="cur" data-fn="mic">Tentar de novo</button><button class="btn" data-act="cur" data-fn="self">Próxima →</button></div>`;
          b.style.display="none";
        }catch(e){
          if(e==="not-allowed"||e==="service-not-allowed")micBlocked=true;
          $("#fb").innerHTML=`<div class="fb">${micBlocked?"O microfone não está disponível nesta página. Fale em voz alta e confirme abaixo.":"Não consegui ouvir ("+esc(String(e))+"). Tente de novo ou confirme manualmente."}</div>`;
          if(micBlocked){b.style.display="none";const sf=document.querySelector("[data-fn=self]");if(sf)sf.textContent="Falei em voz alta ✓";}else{b.disabled=false;b.textContent="🎤 Falar agora";}
        }
      },
      self(){addXP(4);i++;show();}
    };
  }
  show();
}

/* ---------- 5. Montar a frase ---------- */
function aBLD(){
  const c=content();
  const pool=c.chunks.filter(x=>{const n=x.ex.split(" ").length;return n>=4&&n<=9;});
  const items=pick(pool,4);let i=0,bank,ans,locked;
  function show(){
    const it=items[i];
    if(!it){finishBlock();return;}
    bank=shuffle(it.ex.split(" ").map((w,k)=>({w,k})));ans=[];locked=false;draw();
  }
  function draw(){
    const it=items[i];
    stage(`<div class="qhead"><span class="tag">Montar · ${i+1}/${items.length}</span><div class="bar"><i style="width:${i/items.length*100}%"></i></div></div>
      <div class="card"><div class="qlabel">Monte em inglês:</div><div style="font-size:19px;font-weight:700">${esc(it.exPt)}</div>
      <div class="build">${ans.length?ans.map(t=>`<button class="tok" data-act="cur" data-fn="back" data-k="${t.k}">${esc(t.w)}</button>`).join(""):`<span class="ph">Toque nas palavras abaixo…</span>`}</div>
      <div class="bank">${bank.map(t=>`<button class="tok" data-act="cur" data-fn="add" data-k="${t.k}">${esc(t.w)}</button>`).join("")}</div>
      <div class="row"><button class="btn" data-act="cur" data-fn="check">Verificar</button></div><div id="fb"></div></div>`);
    cur={
      add(el){if(locked)return;const k=+el.dataset.k;const t=bank.find(x=>x.k===k);bank=bank.filter(x=>x.k!==k);ans.push(t);draw();},
      back(el){if(locked)return;const k=+el.dataset.k;const t=ans.find(x=>x.k===k);ans=ans.filter(x=>x.k!==k);bank.push(t);draw();},
      check(){
        if(locked||!ans.length)return;locked=true;
        const got=ans.map(t=>t.w).join(" "),ok=got===it.ex;
        if(ok)addXP(6);else addXP(2);
        $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"✓ Perfeito!":"Quase."}</b>${ok?"":`<div class="mt">Correto: <b>${esc(it.ex)}</b></div>`}</div>
          <div class="row"><button class="btn small ghost" data-act="say" data-t="${esc(it.ex)}">🔊 Ouvir</button><button class="btn" data-act="cur" data-fn="nx">Próxima →</button></div>`;
        say(it.ex);
      },
      nx(){i++;show();}
    };
  }
  show();
}

/* ---------- 6. Mini prova + ritual do sono ---------- */
function aEND(){
  const c=content();
  const cp=S.seen.length?S.seen:c.chunks.filter(x=>db.cards[x.en]);
  const dp=S.dseen.length?S.dseen:c.dec;
  const qs=buildQs(5,cp,dp);
  stage(`<div class="card center"><h2>Mini prova 📝</h2><p class="mute">5 perguntas sobre o que você viu hoje. Sem pressão: errar aqui ajuda a fixar.</p><button class="btn" data-act="cur" data-fn="go">Começar</button></div>`);
  cur={go(){quiz(qs,{title:"Mini prova",mount:stage,onAnswer:ok=>{if(ok)addXP(4);},onDone:r=>{S.quiz=r;ritual();}});}};
}
function ritual(){
  const c=content();
  let list=[...S.missed];
  S.seen.forEach(x=>{if(list.length<3&&!list.includes(x))list.push(x);});
  if(list.length<3)list=list.concat(pick(c.chunks.filter(x=>db.cards[x.en]&&!list.includes(x)),3-list.length));
  if(!list.length)list=pick(c.chunks,3);
  list=list.slice(0,3);
  stage(`<div class="card"><h2>Ritual do sono 🌙</h2>
    <p class="mute">Leia e ouça cada frase uma vez, devagar. Rever logo antes de dormir ajuda o cérebro a guardar.</p>
    ${list.map(x=>`<div class="li"><div class="t"><b>${esc(x.en)}</b> · ${esc(x.pt)}<br><i class="mute">${esc(x.ex)}</i></div><button class="btn small ghost" data-act="say" data-t="${esc(x.ex)}" data-r="0.85">🔊</button></div>`).join("")}
    <button class="btn mt" data-act="cur" data-fn="fin">Encerrar a noite</button></div>`);
  cur={fin(){finalize();}};
}
function finalize(){
  addXP(20);commit(true);clearInterval(tickInt);
  const mins=Math.max(1,Math.round(S.secs/60)),st=streak(),c=content(),t=today();
  const tomorrow=c.chunks.filter(x=>db.cards[x.en]&&db.cards[x.en].due<=addDays(t,1)).length;
  const q=S.quiz;
  stage(`<div class="card center"><div style="font-size:44px">🌙</div><h2>Boa noite!</h2>
    <p class="mute">Sessão concluída. Agora largue o celular e durma.</p>
    <div class="stats" style="margin-top:14px"><div class="stat"><b>${mins}'</b><span>de treino</span></div><div class="stat"><b>+${S.xp}</b><span>XP</span></div><div class="stat"><b>${st}</b><span>noites seguidas</span></div></div>
    <p class="small">Ditados decodificados: <b>${S.decOk}/${S.decTot}</b>${q?` · Mini prova: <b>${q.correct}/${q.total}</b>`:""}</p>
    <p class="mute small">Amanhã: ${tomorrow} carta(s) para revisar.</p>
    <button class="btn" data-act="home">Voltar ao início</button></div>`);

   ============================================================ */
function blitz(){
  clearTimers();stopAll();S=null;
  const c=content();let pool=[],score=0,lives=3,left=60,locked=false;
  app.innerHTML=`<div class="top"><button class="x" data-act="home" aria-label="Voltar">✕</button><div class="blockname" style="margin:0"><b>⚡ Desafio relâmpago</b></div></div><div id="bz"></div>`;
  const bz=h=>{$("#bz").innerHTML=h;};
  bz(`<div class="card center"><h2>Pronto?</h2><p class="mute">Ouça a fala rápida e escolha a frase correta. 60 segundos, 3 vidas. Cada erro custa uma vida.</p><p>Seu recorde: <b>${db.best.blitz}</b></p><button class="btn" data-act="cur" data-fn="go">Começar</button></div>`);
  function end(){
    clearInterval(blitzInt);stopAll();
    const newBest=score>db.best.blitz;if(newBest)db.best.blitz=score;
    addXP(score*3);
    bz(`<div class="card center"><div style="font-size:40px">${newBest?"🏆":"⚡"}</div><h2>${score} acerto(s)</h2>
      <p class="mute">${newBest?"Novo recorde!":"Recorde: "+db.best.blitz} · +${score*3} XP</p>
      <div class="row"><button class="btn" data-act="cur" data-fn="go">Jogar de novo</button><button class="btn ghost" data-act="home">Início</button></div></div>`);
  }
  function nextQ(){
    if(lives<=0||left<=0){end();return;}
    if(!pool.length)pool=shuffle(c.dec);
    const it=pool.pop();locked=false;
    const opts=shuffle([it.full,...pick(c.dec.filter(x=>x.full!==it.full),2).map(x=>x.full)]);
    bz(`<div class="card"><div class="row" style="margin:0;justify-content:space-between;align-items:center"><span class="hearts">${"❤️".repeat(lives)}${"🖤".repeat(3-lives)}</span><b class="disp" style="font-size:22px">${score}</b></div>
      <div class="bar mt"><i id="tbar" style="width:${left/60*100}%"></i></div>
      ${waveHTML()}<div class="row center" style="margin-top:0"><button class="btn small ghost" data-act="say" data-t="${esc(it.said)}">🔁 Ouvir de novo</button></div>
      <div class="opts">${opts.map((t,k)=>`<button class="opt" data-act="cur" data-fn="ans" data-ok="${t===it.full?1:0}">${esc(t)}</button>`).join("")}</div></div>`);
    say(it.said);
  }
  cur={
    go(){
      score=0;lives=3;left=60;pool=[];clearInterval(blitzInt);
      blitzInt=setInterval(()=>{left-=0.1;const b=$("#tbar");if(b)b.style.width=Math.max(0,left/60*100)+"%";if(left<=0)end();},100);
      nextQ();
    },
    ans(el){
      if(locked)return;locked=true;
      const ok=el.dataset.ok==="1";
      document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.ok==="1")b.classList.add("ok");});
      if(ok)score++;else{el.classList.add("bad");lives--;}
      setTimeout(nextQ,ok?500:1100);
    }
  };
}

function importPack(){
  const msg=(t,ok)=>{$("#packMsg").innerHTML=`<span style="color:var(${ok?"--mint":"--coral"})">${esc(t)}</span>`;};
  let j;try{j=JSON.parse($("#packTxt").value.trim());}catch(e){msg("JSON inválido: "+e.message,false);return;}
  const c=content();const have=new Set(c.chunks.map(x=>x.en.toLowerCase())),haveD=new Set(c.dec.map(x=>x.said.toLowerCase()));
  let nc=0,nd=0,nl=0;
  (j.chunks||[]).forEach(x=>{if(x&&x.en&&x.pt&&x.ex&&x.exPt&&!have.has(String(x.en).toLowerCase())){db.pack.chunks.push({en:String(x.en),pt:String(x.pt),ex:String(x.ex),exPt:String(x.exPt),cat:String(x.cat||"extra")});have.add(String(x.en).toLowerCase());nc++;}});
  (j.decoder||[]).forEach(x=>{if(x&&x.said&&x.full&&x.pt&&!haveD.has(String(x.said).toLowerCase())){db.pack.decoder.push({said:String(x.said),full:String(x.full),pt:String(x.pt),tip:String(x.tip||"")});haveD.add(String(x.said).toLowerCase());nd++;}});
  (j.dialogues||[]).forEach(x=>{
    if(x&&x.title&&Array.isArray(x.lines)&&x.lines.length&&Array.isArray(x.qs)&&x.qs.every(q=>q&&q.q&&Array.isArray(q.opts)&&q.opts.length>=2&&Number.isInteger(q.a)&&q.a>=0&&q.a<q.opts.length)){
      db.pack.dialogues.push({title:String(x.title),accent:LANG[x.accent]?x.accent:"US",lines:x.lines.map(l=>({who:l.who==="B"?"B":"A",text:String(l.text)})),qs:x.qs.map(q=>({q:String(q.q),opts:q.opts.map(String),a:q.a}))});nl++;
    }
  });
  save();
  if(!nc&&!nd&&!nl){msg("Nada novo encontrado (ou itens duplicados / incompletos).",false);return;}
  msg(`Adicionado: ${nc} frases, ${nd} falas rápidas, ${nl} diálogos.`,true);
  setTimeout(library,900);
}

async function chatAsk(userText){
  const c=chat;
  if(userText!==null){c.turns.push({role:"user",content:userText});c.msgs.push({who:"me",text:userText});c.users++;if(c.users<=8)addXP(5);}
  c.err="";c.retry0=false;
  const hide=c.level!=="easy"&&TTS;
  c.msgs.push({who:"cat",text:"",hide:hide,pending:true});
  c.busy=true;chatDraw();
  const ctl=new AbortController();c.ctl=ctl;
  const rules=chatRules(c.scn,chatLevel())+(c.turns.length?"":"\n\nStart the conversation now with your first line, in character.");
  const input=[{role:"user",content:rules}].concat(c.turns.slice(-14));
  try{
    const r=await sampleFn(input,{modelTier:"quick",cache:false,signal:ctl.signal,onText:u=>{const m=c.msgs[c.msgs.length-1];if(m&&m.pending){m.text=u.text;chatLive(u.text,m.hide);}}});
    const m=c.msgs[c.msgs.length-1];m.text=String(r.text).trim();m.pending=false;
    c.turns.push({role:"assistant",content:m.text});
    c.busy=false;chatDraw();
    say(m.text,{accent:db.settings.accent,rate:chatLevel().r});
  }catch(e){
    c.busy=false;c.msgs.pop();
    if(userText!==null){c.msgs.pop();c.turns.pop();c.users=Math.max(0,c.users-1);c.draft=userText;}
    else c.retry0=true;
    c.err=(e&&e.code==="cancelled")?"":(CHAT_ERR[e&&e.code]||"Algo deu errado. Envie de novo.");
    if(e&&e.code==="cancelled"&&userText===null)c.retry0=true;
    chatDraw();
  }
}
function glossHTML(m){

async function chatTr(i){
  const c=chat,m=c&&c.msgs[i];if(!m||m.trBusy)return;
  if(m.gloss){m.gloss=null;chatDraw();return;}
  if(m.glossCache){m.gloss=m.glossCache;chatDraw();return;}
  const toks=m.text.split(/\s+/).filter(Boolean);
  m.trBusy=true;c.err="";chatDraw();
  const prompt='Translate this English text into Brazilian Portuguese for a language learner, word by word. The text is split into '+toks.length+' tokens (JSON array below). Reply with ONLY a JSON object: {"pal":[...],"fr":"..."} where "pal" has EXACTLY '+toks.length+' strings, one per token in the same order: the short meaning of that token in this context (1 to 3 words; use an empty string for pure punctuation; for parts of a phrase or idiom give the meaning of the whole phrase on its first token and an empty string or a short hint on the rest), and "fr" is the natural Portuguese translation of the whole text.\nTOKENS: '+JSON.stringify(toks);
  try{
    const j=await sampleFn.json(prompt,{modelTier:"quick",cache:true});
    const pal=Array.isArray(j&&j.pal)?j.pal.map(x=>String(x||"")):[];
    while(pal.length<toks.length)pal.push("");
    m.glossCache={toks:toks,pt:pal.slice(0,toks.length),fr:String(j&&j.fr||"")};
    m.gloss=m.glossCache;

let g=null,gCfg={sc:"cafe",hide:true,gl:false};
function gTokens(txt){
  return txt.split(/\s+/).filter(Boolean).map(w=>{
    const k=w.toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,"");
    return `<span class="w"><span class="g">${esc(GDICT[k]||"")}</span><span class="e">${esc(w)}</span></span>`;
  }).join("");
}
function gTop(back){return `<div class="top"><button class="x" data-act="${back}" aria-label="Voltar">✕</button><div class="blockname" style="margin:0"><b>🐈‍⬛ Conversa guiada</b></div></div>`;}
function gSetup(){
  clearTimers();stopAll();S=null;g=null;
  app.innerHTML=gTop("home")+`
   <div class="card center">${chatAvatar()}<p style="margin-bottom:0">Sem limite e sem internet do Claude. O Gato pergunta, você escolhe uma resposta (ou escreve a sua) e ouve a pronúncia.</p></div>
   <div class="card"><h3>Situação</h3><div class="chips">${GSC.map(s=>`<button class="chip ${gCfg.sc===s.id?"on":""}" data-act="gCfg" data-k="sc" data-v="${s.id}">${s.ico} ${s.name}</button>`).join("")}</div>
   <h3 class="mt">Texto do Gato</h3><div class="chips"><button class="chip ${gCfg.hide?"on":""}" data-act="gCfg" data-k="hide" data-v="1">Escondido (só ouvir)</button><button class="chip ${!gCfg.hide?"on":""}" data-act="gCfg" data-k="hide" data-v="0">Visível</button></div>
   <h3 class="mt">Tradução em cima das palavras</h3><div class="chips"><button class="chip ${!gCfg.gl?"on":""}" data-act="gCfg" data-k="gl" data-v="0">Desligada</button><button class="chip ${gCfg.gl?"on":""}" data-act="gCfg" data-k="gl" data-v="1">Ligada</button></div>
   <button class="btn mt" data-act="gStart">Começar</button></div>`;
}
function gStart(){
  unlockAudio();
  const s=GSC.find(x=>x.id===gCfg.sc)||GSC[0];
  g={s:s,i:0,msgs:[{who:"cat",i:0}],gl:gCfg.gl,hide:gCfg.hide,t0:Date.now(),busy:false};
  gDraw();gSayCat(0);
}
function gSayCat(i){say(g.s.turns[i].en,{accent:g.s.acc,rate:Math.min(1,db.speed||0.9)});}
function gDraw(){
  const a=g;if(!a)return;
  const keep=$("#gIn")?$("#gIn").value:"";
  const msgs=a.msgs.map((m,k)=>{
    if(m.who==="me")return `<div class="bub me">${esc(m.text)}</div>`;
    const tr=a.s.turns[m.i];
    const showTxt=!a.hide||m.shown||a.gl;
    const body=a.gl?gTokens(tr.en)+`<div class="trf">${esc(tr.pt)}</div>`:(showTxt?esc(tr.en):`<span class="hid">🔊 Ouça e tente entender…</span>`);
    return `<div class="bub cat"><div class="bt">${body}</div><div class="acts"><button class="btn small ghost" data-act="gSay" data-k="${m.i}">🔊 Ouvir</button><button class="btn small ghost" data-act="gSay" data-k="${m.i}" data-r="0.7">🐢 Devagar</button>${showTxt?"":`<button class="btn small ghost" data-act="gShow" data-k="${k}">Ver texto</button>`}</div></div>`;
  }).join("");
  const done=a.i>=a.s.turns.length;
  const opts=done?"":`<h3 class="mt">Escolha sua resposta</h3>`+a.s.turns[a.i].r.map((r,k)=>`<div class="li"><div class="t">${a.gl?gTokens(r):`<b>${esc(r)}</b>`}</div><button class="btn small ghost" data-act="gHear" data-k="${k}" aria-label="Ouvir">🔊</button><button class="btn small" data-act="gPick" data-k="${k}" ${a.busy?"disabled":""}>Usar</button></div>`).join("")+
    `<div class="chatbar"><input id="gIn" class="inp" placeholder="Ou escreva a sua…" autocomplete="off" value="${esc(keep)}"><button class="btn" data-act="gSend" ${a.busy?"disabled":""}>Enviar</button></div>`;
  app.innerHTML=gTop("gExit")+`<div class="center">${chatAvatar()}</div><p class="mute small center">${a.s.ico} ${a.s.name} · fala ${Math.min(a.i+1,a.s.turns.length)} de ${a.s.turns.length}</p><div class="msgs">${msgs}</div>${opts}
   ${done?`<div class="card center"><h2>Concluído! 🎉</h2><p>Você completou a conversa. Tente de novo ouvindo sem ler, ou mude de situação.</p><div class="row"><button class="btn ghost" data-act="gSetup">Outra situação</button><button class="btn" data-act="home">Início</button></div></div>`:`<div class="row"><button class="btn ghost small" data-act="gToggle">${a.gl?"Desligar tradução":"🇧🇷 Tradução"}</button></div>`}`;
  window.scrollTo(0,document.body.scrollHeight);
}
function gReply(text){
  const a=g;if(!a||a.busy||a.i>=a.s.turns.length)return;
  a.busy=true;a.msgs.push({who:"me",text:text});
  if(a.i<8)addXP(5);
  a.i++;
  const more=a.i<a.s.turns.length;
  if(more)a.msgs.push({who:"cat",i:a.i});
  a.busy=false;
  if(!more){const d=today();db.secs[d]=(db.secs[d]||0)+Math.min(1200,Math.round((Date.now()-a.t0)/1000));addXP(10);}
  gDraw();
  say(text,{accent:a.s.acc,rate:0.95,voice:1}).then(()=>{if(g===a&&more)gSayCat(a.i);});
}
function gExit(){if(g&&g.i>0&&g.i<g.s.turns.length)ask("Sair da conversa guiada?",()=>{stopAll();gSetup();});else{stopAll();gSetup();}}
/* ============================================================
   PROGRESSO + RESUMO PARA O CLAUDE
   ============================================================ */
const WD=["D","S","T","Q","Q","S","S"];
function last7(){const d=today();return Array.from({length:7},(_,k)=>addDays(d,k-6));}
function wdOf(d){const p=d.split("-").map(Number);return{w:WD[new Date(p[0],p[1]-1,p[2]).getDay()],n:p[2]};}
function buildSummary(){
  const d0=today(),c=content(),days=last7();
  const mins=days.map(d=>wdOf(d).w+" "+Math.round((db.secs[d]||0)/60)+"'").join(" | ");
  let ok=0,tot=0,so=0,st=0;
  days.forEach(d=>{const s=db.stats[d];if(s){ok+=s.dec[0];tot+=s.dec[1];so+=s.srs[0];st+=s.srs[1];}});
  const cards=Object.values(db.cards),dom=cards.filter(x=>x.box>=3).length;
  const weakDec=c.dec.filter(x=>db.dec[x.said]&&db.dec[x.said].lapses>0).sort((a,b)=>db.dec[b.said].lapses-db.dec[a.said].lapses).slice(0,5);
  const weakCh=c.chunks.filter(x=>db.cards[x.en]&&db.cards[x.en].lapses>0).sort((a,b)=>db.cards[b.en].lapses-db.cards[a.en].lapses).slice(0,5);
  const ex=db.exams.slice(-3).map(e=>e.d+": "+e.p+"% (escuta "+e.o+"%, vocabulário "+e.v+"%)").join("; ")||"nenhuma ainda";
  return [
    "Resumo da semana — Pulo do Gato ("+d0+")",
    "Minutos por dia: "+mins,
    "Decodificador: "+(tot?Math.round(ok/tot*100)+"% de acerto ("+ok+"/"+tot+")":"sem dados")+". Velocidade atual: "+(db.speed||0.9).toFixed(2)+"x.",
    "Revisão de frases: "+(st?Math.round(so/st*100)+"% sem errar ("+so+"/"+st+")":"sem dados")+".",
    "Cartas: "+dom+" dominadas, "+(cards.length-dom)+" em aprendizado, "+(c.chunks.length-cards.length)+" novas.",
    "Provas recentes: "+ex+".",
    "Falas rápidas que mais errei: "+(weakDec.length?weakDec.map(x=>'"'+x.said+'" = '+x.full+" ("+db.dec[x.said].lapses+"x)").join("; "):"nenhuma")+".",
    "Frases que mais errei: "+(weakCh.length?weakCh.map(x=>x.en+" ("+db.cards[x.en].lapses+"x)").join("; "):"nenhuma")+".",
    "Gosto de: esportes, viagens, tecnologia e animes.",
    "Peça: gere o próximo pacote para o Pulo do Gato focando nesses pontos fracos."
  ].join("\n");
}
function progress(){
  clearTimers();stopAll();S=null;
  const c=content(),days=last7();
  const mins=days.map(d=>Math.round((db.secs[d]||0)/60));
  const maxM=Math.max(30,...mins);
  const rows=days.map((d,k)=>{
    const w=wdOf(d),s=db.stats[d];
    const pc=s&&s.dec[1]?Math.round(s.dec[0]/s.dec[1]*100)+"%":"—";
    return `<div class="li"><div class="day-l">${w.w} ${w.n}</div><div style="flex:1;min-width:0"><div class="bar"><i style="width:${mins[k]/maxM*100}%"></i></div></div><div class="num">${mins[k]}'</div><div class="num">${pc}</div></div>`;
  }).join("");
  const cards=Object.values(db.cards),dom=cards.filter(x=>x.box>=3).length;
  const decR=Object.values(db.dec).filter(x=>x.seen>0),decDom=decR.filter(x=>(x.box||0)>=3).length;
  const weak=c.dec.filter(x=>db.dec[x.said]&&db.dec[x.said].lapses>0).sort((a,b)=>db.dec[b.said].lapses-db.dec[a.said].lapses).slice(0,5);
  const ex=db.exams.slice(-3).reverse();
  app.innerHTML=`<div class="top"><button class="x" data-act="home" aria-label="Voltar">✕</button><div class="blockname" style="margin:0"><b>📈 Meu progresso</b></div></div>
    <div class="stats">
      <div class="stat"><b>${(db.speed||0.9).toFixed(2)}×</b><span>velocidade do Decodificador</span></div>
      <div class="stat"><b>${decDom}</b><span>falas rápidas dominadas</span></div>
      <div class="stat"><b>${dom}</b><span>frases dominadas</span></div>
    </div>
    <div class="card"><h3>Últimos 7 dias</h3>
      <div class="li th"><div class="day-l">dia</div><div style="flex:1;min-width:0">minutos treinados (meta: 30)</div><div class="num">min</div><div class="num">ditado</div></div>
      ${rows}</div>
    <div class="card"><h3>Falas que mais voltam</h3>
      ${weak.length?weak.map(x=>`<div class="li"><div class="t"><span class="mono small">${esc(x.said)}</span><br><b>${esc(x.full)}</b></div><span class="mute small">${db.dec[x.said].lapses}×</span><button class="btn small ghost" data-act="say" data-t="${esc(x.said)}">🔊</button></div>`).join(""):`<p class="mute">Nenhuma ainda. Os erros do Decodificador aparecem aqui.</p>`}</div>
    ${ex.length?`<div class="card"><h3>Provas</h3>${ex.map(e=>`<div class="li"><div class="t">${esc(e.d)}</div><b>${e.p}%</b><span class="mute small">escuta ${e.o}% · vocab ${e.v}%</span></div>`).join("")}</div>`:""}
    <div class="card"><h3>Resumo para o Claude</h3>
      <p class="mute small">Copie e cole no chat. Com ele eu monto o próximo pacote para os seus pontos fracos.</p>
      <textarea id="sumTxt" class="inp" readonly style="min-height:190px">${esc(buildSummary())}</textarea>
      <div class="row"><button class="btn" data-act="copySummary">Copiar resumo</button></div>
      <div id="sumMsg" class="small mt mute"></div></div>`;
}
function copySummary(){
  const ta=$("#sumTxt");if(!ta)return;
  ta.value=buildSummary();
  const msg=h=>{const m=$("#sumMsg");if(m)m.textContent=h;};
  const fallback=()=>{ta.focus();ta.select();msg("Selecione o texto acima e copie.");};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>msg("Copiado. Cole no chat com o Claude."),fallback);}
    else fallback();
  }catch(e){fallback();}
}

const acts={

  next:()=>finishBlock(),blitz:()=>blitz(),exam:()=>exam(),library:()=>library(),method:()=>method(),
  say:el=>say(el.dataset.t,{rate:+el.dataset.r||1,accent:el.dataset.a||undefined,voice:+el.dataset.v||0,pitch:(+el.dataset.v===1)?0.85:1}),
  setAccent:el=>{db.settings.accent=el.dataset.v;save();home();say("Hey, how's it going?");},
  cur:(el,e)=>{if(cur[el.dataset.fn])cur[el.dataset.fn](el,e);},
  libTab:el=>{libTab=el.dataset.v;library();},
  importPack,
  clearPack:()=>ask("Remover todos os pacotes adicionados? As cartas já estudadas desses pacotes perdem o vínculo.",()=>{db.pack={chunks:[],decoder:[],dialogues:[]};save();library();})
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=acts[el.dataset.act];if(f)f(el,e);});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="ans"&&cur.check)cur.check();else if(e.target.id==="chatIn")chatSend();else if(e.target.id==="gIn"&&cur.gSend===undefined){const v=e.target.value.trim();if(v){unlockAudio();gReply(v);}}});
document.addEventListener("input",e=>{if(e.target.id==="libq"){libQ=e.target.value;libList();}});
window.addEventListener("beforeunload",()=>{if(S)commit(false);});

home();
initCloud();
initSample();
